    <div class="chat-area-child">
        <div class="header-of-channel">
            <h3>Neue Nachricht</h3>
            <div class="input-area">
                <h4>An</h4>
                <input [formControl]="input" class="search-input" type="text" placeholder="#Channel, @Name oder die E-Mail Adresse">
            </div>
            
            
        </div>
        @if(searchResults.length>0){
        <div class="search-results">
            @for(item of searchResults; track item){
                <h4 (click)="openChatOrChannel(item)">{{item}}</h4>
            }
        </div> 
        }
        <div class="channel-chat">
        </div>
        <form class="messages-form" [formGroup] ="sendMessageForm" (ngSubmit)="sendMessage()">
            <textarea formControlName="message" type="text" placeholder="Deine Nachricht hier eingeben">
            </textarea>
            <button type="submit">
                <img src="/assets/img/send.png" alt="send">
            </button>
        </form>   
    </div>
