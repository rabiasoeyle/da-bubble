<!-- This dialog should open, when the user selects that they dont remember the password -->
<div>
    <button>Zurück</button>
    <h3>Passwort zurücksetzen</h3>
    <p>Bitte geben Sie Ihre Email-Adresse ein</p>
    <input type="email">
    <p>Wir senden Ihnen eine E-Mail über die Sie Ihr Passwort ändern können</p>
    <button disabled (click)="sendChangePasswordLink()" ></button>
</div>
