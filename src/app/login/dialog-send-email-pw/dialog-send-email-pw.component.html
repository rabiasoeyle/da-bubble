<!-- This dialog should open, when the user selects that they dont remember the password -->
<div>
    <button class="arrow-btn" (click)="goBackToLogin()">
        <img src="/assets/img/arrow_back.png" alt="arrow">
    </button>
    <h2>Passwort zurücksetzen</h2>
    <h4>Bitte geben Sie Ihre Email-Adresse ein</h4>
    <form [formGroup] ="form" (ngSubmit)="onSubmit()">
        <div class="input-area">
            <img src="/assets/img/mail.png" alt="">
            <input formControlName="email" type="email" placeholder="E-Mail">
        </div>
        <h4 class="grey-font">Wir senden Ihnen eine E-Mail über die Sie Ihr Passwort ändern können</h4>
        <button class="white-btn" type="submit" disabled>E-Mail senden</button>
    </form>
</div>
