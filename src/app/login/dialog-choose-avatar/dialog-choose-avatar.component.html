<!-- This component should open when a new account is in the creatingmode -->
<button (click)="goTo('')">Zurück</button>
<h3>Wähle einen Avatar!</h3>
<img src="{{dummyProfile}}" alt="">
<h4>Nutzername</h4>
<p>Aus der Liste wählen!</p>
<div class="avatarImages">
@for(item of profiles; track item){
    <img class="avatarImage" (click)="saveNewAvatar(item)" src="{{item}}" alt="picture">
}
</div>
<button (click)="goTo('main')">Weiter</button>
